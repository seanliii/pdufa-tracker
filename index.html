<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDUFA 2026 | FDA 新药审批日历</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0f1a; color: #e0e6f0; font-family: 'Segoe UI', -apple-system, sans-serif; min-height: 100vh; }
  
  header { background: linear-gradient(135deg, #0d1b2a 0%, #1a2744 100%); border-bottom: 1px solid #1e3a5f; padding: 24px 32px; }
  .header-top { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  h1 { font-size: 28px; font-weight: 700; color: #60a5fa; }
  .subtitle { color: #94a3b8; font-size: 14px; }
  .badge { background: #1e3a5f; border: 1px solid #2563eb; color: #60a5fa; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }

  .controls { padding: 20px 32px; display: flex; gap: 12px; flex-wrap: wrap; background: #0d1420; border-bottom: 1px solid #1e2d4a; }
  .filter-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid #2d4a7a; background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px; transition: all 0.2s; }
  .filter-btn.active { background: #1e3a5f; color: #60a5fa; border-color: #3b82f6; }
  .filter-btn:hover { border-color: #60a5fa; color: #e0e6f0; }

  .stats { display: flex; gap: 24px; padding: 20px 32px; background: #0b1220; border-bottom: 1px solid #1e2d4a; }
  .stat { text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; }
  .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .stat-num.green { color: #22c55e; }
  .stat-num.yellow { color: #f59e0b; }
  .stat-num.blue { color: #60a5fa; }
  .stat-num.red { color: #f87171; }

  .main { padding: 24px 32px; }
  .section-title { font-size: 13px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; margin-top: 24px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  
  .card { background: #0f1e33; border: 1px solid #1e3a5f; border-radius: 12px; padding: 18px; transition: all 0.2s; position: relative; overflow: hidden; }
  .card:hover { transform: translateY(-2px); border-color: #3b82f6; box-shadow: 0 8px 24px rgba(59,130,246,0.12); }
  .card.high { border-left: 3px solid #f59e0b; }
  .card.approved { border-left: 3px solid #22c55e; }
  .card.rejected { border-left: 3px solid #ef4444; }
  .card.upcoming { border-left: 3px solid #60a5fa; }
  
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .drug-name { font-size: 17px; font-weight: 700; color: #e2e8f0; }
  .company { font-size: 13px; color: #64748b; margin-top: 2px; }
  
  .tag-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tag { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .tag.approved { background: #14532d; color: #4ade80; }
  .tag.high { background: #451a03; color: #fbbf24; }
  .tag.upcoming { background: #1e3a5f; color: #93c5fd; }
  .tag.rejected { background: #450a0a; color: #fca5a5; }
  .tag.type { background: #1e1b4b; color: #a5b4fc; }
  .tag.indication { background: #134e4a; color: #5eead4; }
  
  .card-body { font-size: 13px; color: #94a3b8; line-height: 1.6; }
  .date-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #1e2d4a; }
  .pdufa-date { font-size: 12px; color: #60a5fa; font-weight: 600; }
  .prob { font-size: 14px; font-weight: 700; }
  .prob.high { color: #4ade80; }
  .prob.mid { color: #fbbf24; }
  .prob.low { color: #f87171; }

  .ticker { background: #1a2744; color: #93c5fd; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; font-family: monospace; }

  footer { text-align: center; padding: 32px; color: #334155; font-size: 12px; border-top: 1px solid #1e2d4a; margin-top: 32px; }
  .last-updated { color: #475569; font-size: 11px; margin-top: 4px; }

  @media (max-width: 600px) {
    .stats { gap: 16px; padding: 16px; }
    .main { padding: 16px; }
    header { padding: 16px; }
    .controls { padding: 12px 16px; }
  }
</style>

let currentFilter = 'all';

function filter(type) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const grid = document.getElementById('grid');
  let filtered = data;
  
  if (currentFilter !== 'all') {
    filtered = data.filter(d => d.tags.includes(currentFilter));
  }
  
  grid.innerHTML = filtered.map(d => `
    <div class="card ${d.status === 'approved' ? 'approved' : d.tags.includes('high') ? 'high' : d.status === 'rejected' ? 'rejected' : 'upcoming'}">
      <div class="card-header">
        <div>
          <div class="drug-name">${d.drug}</div>
          <div class="company">${d.company} &nbsp; <span class="ticker">${d.ticker}</span></div>
        </div>
      </div>
      <div class="tag-group">
        <span class="tag ${d.status === 'approved' ? 'approved' : d.tags.includes('high') ? 'high' : 'upcoming'}">
          ${d.status === 'approved' ? '✅ 已批准' : d.tags.includes('high') ? '⚠️ 高优先' : '🔜 待定'}
        </span>
        <span class="tag type">${d.type}</span>
        <span class="tag indication">${d.indication}</span>
      </div>
      <div class="card-body">${d.desc}</div>
      <div class="date-row">
        <div class="pdufa-date">📅 ${d.date}</div>
        <div class="prob ${d.prob >= 85 ? 'high' : d.prob >= 65 ? 'mid' : 'low'}">审批概率 ${d.prob}%</div>
      </div>
    </div>
  `).join('');
}

render();
